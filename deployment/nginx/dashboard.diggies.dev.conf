# Initial HTTP-only virtual host for the Green Option dashboard (Superset).
#
# Copy this file to /etc/nginx/sites-available/dashboard.diggies.dev,
# enable it, and then run `certbot --nginx -d dashboard.diggies.dev`.
# Certbot adds and maintains the TLS directives; this file intentionally
# contains no certificate paths so first issuance doesn't depend on files
# that don't exist yet - same pattern as api.diggies.dev.conf and
# scylla.nginx.conf on this host.
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.diggies.dev;
    server_tokens off;

    # The native systemd service listens only on 127.0.0.1:8088.
    # Do not expose port 8088 publicly.
    #
    # Superset needs more generous timeouts than a typical proxy default:
    # BigQuery chart queries can run well past nginx's 60s default, and SQL
    # Lab / CSV or dashboard exports can be larger uploads/downloads than a
    # typical API request.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
